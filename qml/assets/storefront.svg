<svg xmlns="http://www.w3.org/2000/svg" width="784" height="566" viewBox="128 168 784 566">
<!-- MIZAN storefront — original work for pos2's login screen. No third-party art.
     Drawn flat, in the app's own palette, light-on-dark: it sits on the login
     gradient (#0C4A4E -> #05090F), so nothing here is darker than #24304E and the
     large shapes are near-white. Colours are baked because QML cannot tint an SVG's
     internals at run time. See assets/CREDITS.md. -->
<defs>
  <linearGradient id="glass" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#EAF1FA"/>
    <stop offset="1" stop-color="#C9D6E8"/>
  </linearGradient>
</defs>

<!-- the halo, same trick the previous illustration used: one soft emerald wash so the
     building is not a white block dropped on a dark gradient -->
<ellipse cx="520" cy="420" rx="470" ry="330" fill="#3ECF7A" opacity="0.10"/>
<ellipse cx="520" cy="404" rx="330" ry="250" fill="#3ECF7A" opacity="0.07"/>

<!-- the ground it stands on -->
<ellipse cx="520" cy="706" rx="392" ry="30" fill="#04131A" opacity="0.38"/>
<rect x="128" y="700" width="784" height="6" rx="3" fill="#7E8798" opacity="0.55"/>

<!-- ===================== the building ===================== -->
<!-- facade -->
<rect x="212" y="286" width="616" height="416" rx="10" fill="#EFF4FA"/>
<rect x="212" y="286" width="616" height="416" rx="10" fill="none" stroke="#B9C3D3" stroke-width="3"/>
<!-- the wall under the glass, a shade down so the shopfront reads as two bands -->
<rect x="212" y="612" width="616" height="90" fill="#E1E8F2"/>
<rect x="212" y="609" width="616" height="4" fill="#B9C3D3"/>

<!-- the sign board: a name plate, not lettering. Three bars say "the shop's name is
     written here" in every language, which a baked-in word could not. -->
<rect x="196" y="196" width="648" height="82" rx="16" fill="#24304E"/>
<rect x="196" y="196" width="648" height="82" rx="16" fill="none" stroke="#3B4A6B" stroke-width="2"/>
<rect x="292" y="224" width="212" height="18" rx="9" fill="#3ECF7A"/>
<rect x="520" y="224" width="112" height="18" rx="9" fill="#9FB0C9" opacity="0.85"/>
<rect x="292" y="252" width="150" height="10" rx="5" fill="#9FB0C9" opacity="0.45"/>
<rect x="458" y="252" width="76" height="10" rx="5" fill="#9FB0C9" opacity="0.30"/>

<!-- the awning: the one shape nobody mistakes for anything but a shop. Scallops are
     full circles behind the stripe in the stripe's own colour, so there are no arc
     flags to get wrong in a renderer that only speaks SVG Tiny. The pale stripes are
     blue-grey, not white: against a near-white facade a white stripe is not a stripe. -->
<g>
  <circle cx="236" cy="342" r="40" fill="#3ECF7A"/>
  <circle cx="316" cy="342" r="40" fill="#DCE6F2"/>
  <circle cx="396" cy="342" r="40" fill="#3ECF7A"/>
  <circle cx="476" cy="342" r="40" fill="#DCE6F2"/>
  <circle cx="556" cy="342" r="40" fill="#3ECF7A"/>
  <circle cx="636" cy="342" r="40" fill="#DCE6F2"/>
  <circle cx="716" cy="342" r="40" fill="#3ECF7A"/>
  <circle cx="796" cy="342" r="40" fill="#DCE6F2"/>
  <rect x="196" y="286" width="80" height="56" fill="#3ECF7A"/>
  <rect x="276" y="286" width="80" height="56" fill="#DCE6F2"/>
  <rect x="356" y="286" width="80" height="56" fill="#3ECF7A"/>
  <rect x="436" y="286" width="80" height="56" fill="#DCE6F2"/>
  <rect x="516" y="286" width="80" height="56" fill="#3ECF7A"/>
  <rect x="596" y="286" width="80" height="56" fill="#DCE6F2"/>
  <rect x="676" y="286" width="80" height="56" fill="#3ECF7A"/>
  <rect x="756" y="286" width="88" height="56" fill="#DCE6F2"/>
  <rect x="196" y="280" width="648" height="12" rx="6" fill="#C8D3E2"/>
</g>

<!-- ===================== the window ===================== -->
<rect x="250" y="404" width="272" height="200" rx="8" fill="url(#glass)"/>
<rect x="250" y="404" width="272" height="200" rx="8" fill="none" stroke="#8A93A6" stroke-width="5"/>
<!-- shelves, with what a corner shop actually puts on them -->
<rect x="250" y="474" width="272" height="7" fill="#8A93A6"/>
<rect x="250" y="540" width="272" height="7" fill="#8A93A6"/>
<!-- top shelf: bottles -->
<rect x="278" y="432" width="20" height="42" rx="5" fill="#4FD1C5"/>
<rect x="274" y="424" width="28" height="12" rx="6" fill="#4FD1C5"/>
<rect x="312" y="438" width="20" height="36" rx="5" fill="#EE8FB4"/>
<rect x="308" y="430" width="28" height="12" rx="6" fill="#EE8FB4"/>
<rect x="350" y="430" width="24" height="44" rx="5" fill="#E8B04B"/>
<rect x="392" y="440" width="34" height="34" rx="5" fill="#8C9EFF"/>
<rect x="440" y="436" width="30" height="38" rx="5" fill="#3ECF7A"/>
<!-- middle shelf: cartons and tins -->
<rect x="272" y="500" width="42" height="40" rx="4" fill="#E8B04B"/>
<rect x="324" y="508" width="34" height="32" rx="4" fill="#8C9EFF"/>
<circle cx="386" cy="522" r="17" fill="#EE8FB4"/>
<rect x="416" y="502" width="38" height="38" rx="4" fill="#4FD1C5"/>
<rect x="464" y="512" width="44" height="28" rx="4" fill="#B9C3D3"/>
<!-- bottom shelf: sacks -->
<rect x="274" y="562" width="52" height="34" rx="8" fill="#B9C3D3"/>
<rect x="338" y="558" width="46" height="38" rx="8" fill="#9FB0C9"/>
<rect x="398" y="564" width="58" height="32" rx="8" fill="#B9C3D3"/>

<!-- ===================== the door ===================== -->
<rect x="566" y="404" width="176" height="298" rx="8" fill="url(#glass)"/>
<rect x="566" y="404" width="176" height="298" rx="8" fill="none" stroke="#8A93A6" stroke-width="5"/>
<rect x="652" y="404" width="5" height="298" fill="#8A93A6" opacity="0.7"/>
<!-- the handle bars -->
<rect x="630" y="536" width="8" height="44" rx="4" fill="#5D6A80"/>
<rect x="672" y="536" width="8" height="44" rx="4" fill="#5D6A80"/>
<!-- OPEN, as a plate rather than a word -->
<rect x="596" y="430" width="116" height="30" rx="15" fill="#3ECF7A"/>
<rect x="612" y="441" width="46" height="8" rx="4" fill="#0B3D26" opacity="0.75"/>
<rect x="666" y="441" width="30" height="8" rx="4" fill="#0B3D26" opacity="0.45"/>

<!-- ===================== goods out front ===================== -->
<!-- a crate of produce, because a shop spills onto its pavement -->
<rect x="768" y="596" width="120" height="76" rx="10" fill="#E8B04B"/>
<rect x="768" y="596" width="120" height="76" rx="10" fill="none" stroke="#C08F31" stroke-width="3"/>
<rect x="768" y="624" width="120" height="6" fill="#C08F31" opacity="0.6"/>
<circle cx="796" cy="590" r="19" fill="#EE8FB4"/>
<circle cx="830" cy="584" r="21" fill="#3ECF7A"/>
<circle cx="864" cy="590" r="18" fill="#E86B6B"/>
<!-- a second, smaller crate -->
<rect x="152" y="620" width="96" height="54" rx="8" fill="#4FD1C5"/>
<rect x="152" y="620" width="96" height="54" rx="8" fill="none" stroke="#2E9C93" stroke-width="3"/>
<circle cx="176" cy="614" r="15" fill="#E8B04B"/>
<circle cx="204" cy="610" r="17" fill="#E8B04B"/>
<circle cx="232" cy="614" r="14" fill="#E8B04B"/>
</svg>
